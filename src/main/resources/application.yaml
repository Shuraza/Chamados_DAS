spring:
  application:
    name: chamados

  datasource:
    url: "jdbc:h2:mem:chamadosdb"
    username: "sa"
    password: ""
    driver-class-name: "org.h2.Driver"

  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true

  data:
    web:
      pageable:
        serialization-mode: "via-dto"

  h2:
    console:
      enabled: true
      path: "/h2-console"

springdoc:
  packages-to-scan: "br.com.sistemas.chamados.controller"
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operations-sorter: "method"
    tags-sorter: "alpha"
