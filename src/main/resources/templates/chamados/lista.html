<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chamados')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('chamados')}"></header>

<main>
    <div class="titulo-pagina">
        <h1>Chamados</h1>
        <a class="botao" th:href="@{/web/chamados/novo}">+ Abrir chamado</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <form class="filtros" th:action="@{/web/chamados}" method="get">
        <label>Status
            <select name="status">
                <option value="">Todos</option>
                <option th:each="s : ${statusOpcoes}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
            </select>
        </label>
        <label>Prioridade
            <select name="prioridade">
                <option value="">Todas</option>
                <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}" th:selected="${p == prioridade}"></option>
            </select>
        </label>
        <label>Cliente
            <select name="clienteId">
                <option value="">Todos</option>
                <option th:each="c : ${clientes}" th:value="${c.id()}" th:text="${c.nome()}" th:selected="${c.id() == clienteId}"></option>
            </select>
        </label>
        <div style="display: flex; flex-direction: row; gap: 10px; align-items: center">
            <button type="submit">Filtrar</button>
            <a th:href="@{/web/chamados}">Limpar</a>
        </div>

    </form>

    <div th:replace="~{fragments/chamados :: tabela(${pagina})}"></div>

    <div class="paginacao" th:if="${pagina.totalPages > 1}">
        <a th:if="${pagina.hasPrevious()}"
           th:href="@{/web/chamados(page=${pagina.number - 1}, status=${status}, prioridade=${prioridade}, clienteId=${clienteId})}">&laquo; Anterior</a>
        <span th:text="'Página ' + ${pagina.number + 1} + ' de ' + ${pagina.totalPages} + ' (' + ${pagina.totalElements} + ' chamados)'">Página 1 de 1</span>
        <a th:if="${pagina.hasNext()}"
           th:href="@{/web/chamados(page=${pagina.number + 1}, status=${status}, prioridade=${prioridade}, clienteId=${clienteId})}">Próxima &raquo;</a>
    </div>
</main>
</body>
</html>
