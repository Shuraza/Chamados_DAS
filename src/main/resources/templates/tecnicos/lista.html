<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Técnicos')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('tecnicos')}"></header>

<main>
    <div class="titulo-pagina">
        <h1>Técnicos</h1>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="grade">
        <section class="cartao">
            <h2>Cadastrados</h2>
            <p class="vazio" th:if="${#lists.isEmpty(tecnicos)}">Nenhum técnico cadastrado.</p>
            <table th:unless="${#lists.isEmpty(tecnicos)}">
                <thead>
                <tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${tecnicos}">
                    <td><a th:href="@{/web/tecnicos/{id}(id=${c.id()})}" th:text="${c.nome()}">Nome</a></td>
                    <td th:text="${c.email()}">email</td>
                    <td th:text="${c.perfil()}">TECNICO</td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="cartao">
            <h2>Novo técnico</h2>
            <form class="formulario" th:action="@{/web/tecnicos}" th:object="${form}" method="post">
                <label>Nome
                    <input type="text" th:field="*{nome}" maxlength="100">
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </label>
                <label>E-mail
                    <input type="email" th:field="*{email}">
                    <span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </label>
                <label>Perfil
                    <select th:field="*{perfil}">
                        <option value="">Selecione</option>
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></span>
                </label>
                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
